spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sparta_cafe?useSSL=false&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME} 
    password: ${DB_PASSWORD} 
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway로 스키마를 관리하므로 앱 시작 시 검증만 수행
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: sparta-cafe
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-expiration-time: 1800000 # 30분 (단위: ms)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

redisson:
  retry:
    max: 10
    initial-backoff-ms: 50
    max-backoff-ms: 1000
  expiration-seconds: 3
