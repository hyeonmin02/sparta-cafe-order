openapi: 3.0.3
info:
  title: 카페 셀프 오더 시스템 API
  version: 1.0.0
  description: |
    키오스크/모바일 앱에서 사용자가 직접 주문/결제하는 백엔드 API.
    
    - 결제 수단: 포인트 전용 (선충전)
    - 인증: JWT (Bearer Token), userId 는 토큰 subject 에서만 추출
servers:
  - url: http://localhost:8080
    description: 로컬 환경

tags:
  - name: Auth
    description: 회원 인증
  - name: Menu
    description: 메뉴 조회
  - name: Point
    description: 포인트 관리
  - name: Order
    description: 주문/결제

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인 (JWT 발급)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /menus:
    get:
      tags: [Menu]
      summary: 메뉴 목록 조회
      security: []
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'

  /menus/popular:
    get:
      tags: [Menu]
      summary: 인기 메뉴 Top 3 조회 (최근 7일)
      security: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopularMenuResponse'
        '503':
          description: Redis + DB 동시 장애

  /points/charge:
    post:
      tags: [Point]
      summary: 포인트 충전
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointChargeRequest'
      responses:
        '200':
          description: 충전 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointChargeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 분산락 타임아웃 (LOCK_TIMEOUT)

  /points/me:
    get:
      tags: [Point]
      summary: 포인트 잔액 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders:
    post:
      tags: [Order]
      summary: 주문/결제
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: 주문/결제 성공 (응답이 영수증 역할)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 비즈니스 규칙 위반 (재고 부족 / 포인트 부족)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  security:
    - bearerAuth: []

  schemas:
    SignupRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
          minLength: 4
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
          example: kim_jiyeon
        password:
          type: string
          minLength: 8
          example: MyPass1234

    SignupResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            userId:
              type: integer
              format: int64
            loginId:
              type: string

    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: integer
              example: 1800

    MenuListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            menus:
              type: array
              items:
                $ref: '#/components/schemas/MenuSummary'

    MenuSummary:
      type: object
      properties:
        menuId:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: integer
          format: int64
        categoryName:
          type: string
        soldOut:
          type: boolean

    PopularMenuResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            popularMenus:
              type: array
              items:
                type: object
                properties:
                  menuId:
                    type: integer
                  name:
                    type: string
                  price:
                    type: integer
                  orderCount:
                    type: integer
            windowDays:
              type: integer
              example: 7
            calculatedAt:
              type: string
              format: date-time

    PointChargeRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          example: 10000

    PointChargeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            balance:
              type: integer
              format: int64
            chargedAmount:
              type: integer
              format: int64
            chargedAt:
              type: string
              format: date-time

    PointBalanceResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            balance:
              type: integer
              format: int64

    OrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [menuId, quantity]
            properties:
              menuId:
                type: integer
                format: int64
              quantity:
                type: integer
                minimum: 1

    OrderResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            orderId:
              type: integer
              format: int64
            items:
              type: array
              items:
                type: object
                properties:
                  menuId:
                    type: integer
                  menuName:
                    type: string
                  quantity:
                    type: integer
                  unitPrice:
                    type: integer
                  subtotal:
                    type: integer
            totalAmount:
              type: integer
            remainingPoint:
              type: integer
            paidAt:
              type: string
              format: date-time

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: P003
          description: 도메인 prefix + 3자리 번호 (예 A001, M001, P003)
        message:
          type: string
          example: 포인트 잔액이 부족합니다.
        details:
          type: object
          additionalProperties: true
          description: 클라이언트 후속 처리에 필요한 부가 정보 (없으면 생략)

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

security:
  - bearerAuth: []
